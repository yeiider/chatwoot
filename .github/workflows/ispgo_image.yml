# Imagen de IspGo CRM: Chatwoot edición comunitaria (sin la carpeta
# enterprise) con la marca de IspGo, publicada en ghcr.io/yeiider/ispgo-crm.
# develop publica :latest; las ramas de trabajo publican :edge para probar
# antes del merge. En un PR solo se construye.
name: IspGo CRM image

on:
  push:
    branches:
      - develop
      - 'claude/**'
    tags:
      - ispgo-v*
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/yeiider/ispgo-crm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Quitar el código enterprise
        run: |
          rm -rf enterprise spec/enterprise

      - name: Entrada con ISPGO_ROLE
        run: |
          cat >> docker/Dockerfile <<'DOCKER'
          ENV CW_EDITION="ce"
          ENTRYPOINT ["docker/ispgo/entrypoint.sh"]
          DOCKER

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=edge,enable=${{ startsWith(github.ref, 'refs/heads/claude/') }}
            type=sha,prefix=
            type=ref,event=tag

      - uses: docker/setup-buildx-action@v3

      - name: Entrar a ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
